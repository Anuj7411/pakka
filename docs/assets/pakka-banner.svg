<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Pakka - proof the agent bought what you actually asked for">
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1200" height="340" fill="#0E100C"/>

    <!-- oversized seal watermark, bleeding off the right edge -->
    <svg x="812" y="-70" width="470" height="470" viewBox="0 0 32 32" fill="none"
         stroke="#E8C400" stroke-opacity="0.09" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M0 0H22L32 10V32H0Z" stroke-width="0.9"/>
      <g transform="translate(-0.6,0.6)" stroke-width="1.5">
        <path d="M8 8V24"/><path d="M16 8L8 16L16 24"/><path d="M25 8L17 16L25 24"/>
      </g>
    </svg>

    <!-- Haldi accent rule along the top -->
    <rect x="0" y="0" width="1200" height="6" fill="#E8C400"/>

    <!-- the seal: Haldi tile, Ink glyph. Left K complete (may block); right a
         stemless chevron (may only escalate). The asymmetry is the architecture. -->
    <svg x="80" y="104" width="128" height="128" viewBox="0 0 32 32">
      <path d="M0 0H22L32 10V32H0Z" fill="#E8C400"/>
      <g transform="translate(-0.6,0.6)" stroke="#0E100C" stroke-width="3" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M8 8V24"/><path d="M16 8L8 16L16 24"/><path d="M25 8L17 16L25 24"/>
      </g>
    </svg>

    <!-- PAKKA wordmark, brand geometry, drawn in Paper -->
    <svg x="240" y="96" width="300" height="86" viewBox="-2 -2 132 38" fill="none"
         stroke="#F5F2E9" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="1.05" stroke-width="4.6">
      <path d="M2.3 0V32"/><path d="M2.3 2.3H13.3L17.7 6.7V16.5H2.3"/>
      <path d="M26.2 32L34.2 2.3H41.2L49.2 32"/><path d="M29.7 22.5H45.7"/>
      <path d="M57.3 0V32"/><path d="M74 0L57.3 16L74 32"/>
      <path d="M79.3 0V32"/><path d="M96 0L79.3 16L96 32"/>
      <path d="M103.7 32L111.7 2.3H118.7L126.7 32"/><path d="M107.2 22.5H123.2"/>
    </svg>

    <!-- track tag, top right -->
    <text x="1120" y="70" text-anchor="end" fill="#F5F2E9" fill-opacity="0.62"
          font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="17" letter-spacing="1">RAZORPAY AI BUILDATHON · TRACK 01</text>

    <!-- tagline -->
    <text x="242" y="226" fill="#F5F2E9"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="28" font-weight="600">Proof the agent bought what you actually asked for.</text>

    <!-- the verdict lattice, in one glance -->
    <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="19" letter-spacing="1">
      <circle cx="248" cy="284" r="6" fill="#35C88A"/>
      <text x="262" y="290" fill="#35C88A">ALLOW</text>
      <text x="342" y="290" fill="#F5F2E9" fill-opacity="0.4">&lt;</text>
      <circle cx="372" cy="284" r="6" fill="#E8C400"/>
      <text x="386" y="290" fill="#E8C400">ESCALATE</text>
      <text x="506" y="290" fill="#F5F2E9" fill-opacity="0.4">&lt;</text>
      <circle cx="536" cy="284" r="6" fill="#FF6A4D"/>
      <text x="550" y="290" fill="#FF6A4D">BLOCK</text>
      <text x="648" y="290" fill="#F5F2E9" fill-opacity="0.55">decision = max( every source )</text>
    </g>
  </g>
</svg>
