<!-- Micro cut, 16-19px. BRAND.md: stroke 4.5u, model layer dropped, because at
     16px two 2px strokes separated by a sub-pixel gap merge into a smear - and
     the layer that survives should be the one that can act. The chamfer is
     carried over from the small-use cut; BRAND.md fixes 10u (large) and 12u
     (small-use) but states no micro value, so nothing new is invented here. -->
