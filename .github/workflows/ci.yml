name: CI

# Runs the project's own gate on every push and pull request:
# typecheck, the full test suite, and the OC-228 reserve proof.
# This is the real thing behind the "CI" badge in the README.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: typecheck + tests + OC-228 proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the gate (npm run check)
        run: npm run check
